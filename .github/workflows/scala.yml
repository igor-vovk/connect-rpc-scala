name: Scala CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-scala

      - name: Check Formatting
        run: sbt scalafmtCheckAll

      - name: Run tests with sbt 1
        run: sbt test

      - name: Run tests with sbt 2
        run: sbt -Dsbt.task.cpus=2 -sbt-version 2.1.0 test

      - name: Test sbt 1 and sbt 2 plugin consumption
        run: sbt "project sbtConnectRpcScala; +scripted"

  conformance:
    name: Conformance
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-scala

      - name: Run conformance tests
        run: make test-conformance-stable

  dependency-graph:
    name: Update Dependency Graph
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-scala

      - uses: scalacenter/sbt-dependency-submission@v3
        with:
          configs-ignore: scala-tool scala-doc-tool
